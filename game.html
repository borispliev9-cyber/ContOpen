<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🚗 Контейнеры с тачками</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html, body {
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0b0f1c;
            background-image: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: white;
            padding: env(safe-area-inset-top) 8px calc(8px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            will-change: transform;
        }

        .game {
            max-width: 480px;
            width: 100%;
            background: rgba(20, 25, 40, 0.8);
            border-radius: 32px;
            padding: 16px 14px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transform: translateZ(0);
        }

        .balance {
            background: #0f121f;
            border-radius: 100px;
            padding: 10px 20px;
            text-align: center;
            font-size: clamp(1.5rem, 6vw, 2rem);
            font-weight: 800;
            letter-spacing: 1px;
            color: #7ae0a0;
            text-shadow: 0 0 15px rgba(122, 224, 160, 0.6);
            box-shadow: inset 0 0 15px #00000066, 0 5px 0 #0b0e15;
            border-bottom: 2px solid #2f354a;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 56px;
        }

        .balance span { font-size: 0.8em; }

        .info-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .info-badge {
            background: #0f121f;
            border-radius: 100px;
            padding: 8px 12px;
            font-size: clamp(0.7rem, 3vw, 0.8rem);
            font-weight: 700;
            color: #a0a8c0;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #2c3248;
            flex: 1;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
            touch-action: manipulation;
            min-height: 40px;
        }

        .info-badge:active {
            background: #151a2c;
            transform: scale(0.98);
        }

        .info-badge b { color: #ffd966; }

        .tap-area {
            background: radial-gradient(circle at 30% 30%, #2a3147, #121624);
            border-radius: 50%;
            aspect-ratio: 1/1;
            width: 100%;
            max-width: 220px;
            margin: 6px auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 0 #0a0c12, 0 0 0 4px #3e455e, 0 20px 30px black;
            cursor: pointer;
            border: 2px solid #6b7280;
            touch-action: manipulation;
            transform: translateZ(0);
            will-change: transform;
            position: relative;
        }

        .tap-area.pressed {
            transform: translateZ(0) scale(0.95);
            box-shadow: 0 6px 0 #0a0c12, 0 0 0 4px #7ae0a0, 0 20px 30px black;
        }

        .tap-emoji {
            font-size: clamp(3.5rem, 15vw, 5rem);
            filter: drop-shadow(0 8px 8px black);
            pointer-events: none;
        }

        .containers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .containers .container-btn:last-child {
            grid-column: span 2;
        }

        .container-btn {
            background: #1e2338;
            border: none;
            border-radius: 20px;
            padding: 12px 6px;
            color: #ddd;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            box-shadow: 0 6px 0 #0b0e17, 0 0 0 1px #3b425b;
            transition: transform 0.05s;
            cursor: pointer;
            touch-action: manipulation;
            position: relative;
            transform: translateZ(0);
            min-height: 90px;
            justify-content: center;
        }

        .container-btn:active {
            transform: translateY(3px) translateZ(0);
            box-shadow: 0 3px 0 #0b0e17, 0 0 0 1px #ffd966;
        }

        .container-btn .price {
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            color: #ffd966;
            font-weight: 800;
        }

        .container-btn .title {
            font-size: clamp(0.7rem, 3vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #c8cfe0;
            font-weight: 800;
        }

        .container-btn .car-count {
            font-size: clamp(0.6rem, 2.5vw, 0.7rem);
            color: #7b85a0;
            background: #0f121f;
            padding: 1px 8px;
            border-radius: 20px;
            margin-top: 1px;
        }

        .container-btn .jackpot {
            font-size: clamp(0.55rem, 2.2vw, 0.6rem);
            color: #ff4d6d;
            font-weight: 800;
            letter-spacing: 0.3px;
            opacity: 0.9;
            text-align: center;
            line-height: 1.1;
        }

        .container-btn.common { box-shadow: 0 6px 0 #0b0e17, 0 0 0 1px #6b7280; }
        .container-btn.common .title { color: #c8cfe0; }
        .container-btn.common .price { color: #c8cfe0; }

        .container-btn.rare { box-shadow: 0 6px 0 #0b0e17, 0 0 0 2px #4dabff; }
        .container-btn.rare .title { color: #4dabff; }
        .container-btn.rare .price { color: #4dabff; }

        .container-btn.epic { box-shadow: 0 6px 0 #0b0e17, 0 0 0 2px #b366ff; }
        .container-btn.epic .title { color: #b366ff; }
        .container-btn.epic .price { color: #b366ff; }

        .container-btn.legendary { box-shadow: 0 6px 0 #0b0e17, 0 0 0 2px #ff4d6d; }
        .container-btn.legendary .title { color: #ff4d6d; }
        .container-btn.legendary .price { color: #ff4d6d; }

        .container-btn.mythic {
            box-shadow: 0 6px 0 #0b0e17, 0 0 0 2px #ffd966, 0 0 15px #ffd96633;
            background: linear-gradient(145deg, #2a2310, #1e2338);
        }
        .container-btn.mythic .title {
            color: #ffd966;
            text-shadow: 0 0 8px #ffd96688;
        }
        .container-btn.mythic .price { color: #ffd966; }

        @media (prefers-reduced-motion: no-preference) and (min-width: 400px) {
            .container-btn.mythic {
                animation: mythicGlow 3s infinite alternate;
            }
            @keyframes mythicGlow {
                from { box-shadow: 0 6px 0 #0b0e17, 0 0 0 2px #ffd966, 0 0 8px #ffd96633; }
                to { box-shadow: 0 6px 0 #0b0e17, 0 0 0 2px #ffe28a, 0 0 18px #ffd96666; }
            }
        }

        .log {
            background: #0b0e17;
            border-radius: 20px;
            padding: 10px 14px;
            margin-top: 10px;
            height: 80px;
            overflow-y: auto;
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            border: 1px solid #2c3248;
            box-shadow: inset 0 0 10px #00000088;
            color: #b7c0d8;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
            contain: content;
        }

        .log::-webkit-scrollbar { width: 3px; }
        .log::-webkit-scrollbar-track { background: #1e2338; }
        .log::-webkit-scrollbar-thumb { background: #ffd966; border-radius: 10px; }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            border-radius: 10px;
            animation: slideIn 0.15s ease;
            gap: 8px;
            min-height: 22px;
        }

        .log-item .name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .log-item .price {
            font-weight: 700;
            color: #ffd966;
            white-space: nowrap;
        }

        .log-item.rare .name { color: #4dabff; }
        .log-item.epic .name { color: #b366ff; }
        .log-item.legendary .name { color: #ff4d6d; }
        .log-item.mythic .name { color: #ffd966; }
        .log-item.achievement { background: linear-gradient(90deg, #2a2310, transparent); }
        .log-item.achievement .name { color: #ffd966; font-weight: 800; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.15s;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top));
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            -webkit-overflow-scrolling: touch;
        }

        .modal.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(145deg, #1b2133, #0e1220);
            border-radius: 36px;
            padding: 24px 18px 20px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            border: 2px solid #ffd966;
            box-shadow: 0 20px 40px black;
            animation: popIn 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .rarity-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: clamp(0.65rem, 2.8vw, 0.72rem);
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .rarity-badge.common { background: #2a3147; color: #a0a8c0; }
        .rarity-badge.rare { background: #1a3a5c; color: #4dabff; }
        .rarity-badge.epic { background: #3a1f5c; color: #b366ff; }
        .rarity-badge.legendary { background: #5c1f2e; color: #ff4d6d; }
        .rarity-badge.mythic {
            background: linear-gradient(90deg, #5c4a10, #8a6a15);
            color: #ffd966;
            text-shadow: 0 0 6px #ffd966;
        }

        .modal-emoji {
            font-size: clamp(3rem, 13vw, 4.2rem);
            margin-bottom: 6px;
        }

        .modal-car-name {
            font-size: clamp(1.2rem, 5.5vw, 1.5rem);
            font-weight: 800;
            color: white;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .modal-car-price {
            font-size: clamp(1.1rem, 5vw, 1.4rem);
            font-weight: 800;
            color: #7ae0a0;
            margin-bottom: 6px;
            text-shadow: 0 0 12px #7ae0a066;
        }

        .sell-warning {
            font-size: clamp(0.65rem, 2.8vw, 0.72rem);
            color: #ff6b6b;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .modal-btn {
            flex: 1;
            border: none;
            border-radius: 50px;
            padding: 12px 8px;
            font-weight: 800;
            font-size: clamp(0.8rem, 3.5vw, 0.95rem);
            cursor: pointer;
            transition: transform 0.05s;
            touch-action: manipulation;
            min-height: 52px;
        }

        .modal-btn.keep {
            background: #7ae0a0;
            color: #0b0e17;
            box-shadow: 0 5px 0 #4a9c6a;
        }

        .modal-btn.keep:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #4a9c6a;
        }

        .modal-btn.sell {
            background: #ff6b9d;
            color: #0b0e17;
            box-shadow: 0 5px 0 #b33d66;
        }

        .modal-btn.sell:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #b33d66;
        }

        .modal-btn .sub {
            display: block;
            font-size: 0.68em;
            font-weight: 600;
            opacity: 0.9;
            margin-top: 2px;
        }

        .garage-modal .modal-card,
        .ach-modal .modal-card {
            max-width: 440px;
            padding: 18px 14px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
        }

        .garage-title {
            font-size: clamp(1.1rem, 5vw, 1.4rem);
            font-weight: 800;
            color: #ffd966;
            margin-bottom: 8px;
            text-align: center;
        }

        .garage-total,
        .ach-progress {
            text-align: center;
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            color: #a0a8c0;
            margin-bottom: 10px;
        }

        .garage-total b,
        .ach-progress b { color: #7ae0a0; }

        .garage-list,
        .ach-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            padding-right: 2px;
            max-height: 400px;
            -webkit-overflow-scrolling: touch;
            contain: content;
        }

        .garage-list::-webkit-scrollbar,
        .ach-list::-webkit-scrollbar { width: 3px; }
        .garage-list::-webkit-scrollbar-track,
        .ach-list::-webkit-scrollbar-track { background: #1e2338; }
        .garage-list::-webkit-scrollbar-thumb,
        .ach-list::-webkit-scrollbar-thumb { background: #ffd966; border-radius: 10px; }

        .garage-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f121f;
            border-radius: 14px;
            padding: 8px 10px;
            border-left: 3px solid #2a3147;
        }

        .garage-item.rare { border-left-color: #4dabff; }
        .garage-item.epic { border-left-color: #b366ff; }
        .garage-item.legendary { border-left-color: #ff4d6d; }
        .garage-item.mythic { border-left-color: #ffd966; }

        .garage-item-emoji { font-size: 1.5rem; }

        .garage-item-info {
            flex: 1;
            text-align: left;
            min-width: 0;
        }

        .garage-item-name {
            font-weight: 700;
            font-size: clamp(0.8rem, 3.2vw, 0.9rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .garage-item-price {
            font-size: clamp(0.7rem, 2.8vw, 0.78rem);
            color: #7ae0a0;
            font-weight: 600;
        }

        .garage-item-sell {
            background: #ff6b9d;
            border: none;
            border-radius: 10px;
            padding: 8px 9px;
            font-size: clamp(0.62rem, 2.5vw, 0.7rem);
            font-weight: 800;
            color: #0b0e17;
            cursor: pointer;
            box-shadow: 0 3px 0 #b33d66;
            transition: transform 0.05s;
            white-space: nowrap;
            line-height: 1.2;
            touch-action: manipulation;
            min-height: 40px;
            min-width: 60px;
        }

        .garage-item-sell:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b33d66;
        }

        .garage-item-sell .sellpct {
            display: block;
            font-size: 0.85em;
            opacity: 0.85;
        }

        .garage-empty {
            text-align: center;
            color: #6b7280;
            padding: 32px 16px;
            font-size: clamp(0.8rem, 3.2vw, 0.95rem);
        }

        .garage-close {
            background: #ffd966;
            color: #0b0e17;
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 800;
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            cursor: pointer;
            box-shadow: 0 5px 0 #b38f2e;
            transition: transform 0.05s;
            touch-action: manipulation;
            min-height: 48px;
        }

        .garage-close:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #b38f2e;
        }

        .garage-btn {
            background: #1e2338;
            border: 1px solid #3b425b;
            border-radius: 14px;
            padding: 12px 16px;
            color: #ffd966;
            font-weight: 700;
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            touch-action: manipulation;
            min-height: 48px;
        }

        .garage-btn:active { background: #252b44; }

        .garage-btn .count {
            background: #ffd966;
            color: #0b0e17;
            border-radius: 100px;
            padding: 2px 10px;
            font-size: 0.85em;
            font-weight: 800;
        }

        .ach-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f121f;
            border-radius: 14px;
            padding: 8px 10px;
            border-left: 3px solid #2a3147;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .ach-item.unlocked {
            opacity: 1;
            border-left-color: #ffd966;
            background: linear-gradient(90deg, #1e1a0a, #0f121f);
        }

        .ach-item-icon {
            font-size: 1.4rem;
            filter: grayscale(1);
        }

        .ach-item.unlocked .ach-item-icon {
            filter: grayscale(0);
        }

        .ach-item-info {
            flex: 1;
            text-align: left;
            min-width: 0;
        }

        .ach-item-name {
            font-weight: 700;
            font-size: clamp(0.78rem, 3.2vw, 0.9rem);
            color: #c8cfe0;
        }

        .ach-item.unlocked .ach-item-name {
            color: #ffd966;
        }

        .ach-item-desc {
            font-size: clamp(0.65rem, 2.8vw, 0.72rem);
            color: #7b85a0;
            margin-top: 2px;
        }

        .ach-item-status {
            font-size: 1.1rem;
            opacity: 0.3;
        }

        .ach-item.unlocked .ach-item-status {
            opacity: 1;
        }

        .toast {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: linear-gradient(135deg, #2a2310, #1b2133);
            border: 2px solid #ffd966;
            border-radius: 18px;
            padding: 12px 16px;
            z-index: 200;
            box-shadow: 0 10px 30px black, 0 0 20px #ffd96666;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 92%;
            width: max-content;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            will-change: transform;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon { font-size: 1.6rem; }

        .toast-content {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .toast-title {
            font-size: clamp(0.6rem, 2.5vw, 0.68rem);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffd966;
            font-weight: 800;
        }

        .toast-name {
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            font-weight: 800;
            color: white;
        }

        .toast-desc {
            font-size: clamp(0.65rem, 2.8vw, 0.72rem);
            color: #a0a8c0;
        }

        .floating-money {
            position: fixed;
            color: #7ae0a0;
            font-weight: 800;
            font-size: clamp(1.2rem, 4.5vw, 1.5rem);
            text-shadow: 0 0 10px #7ae0a0;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            animation: floatUp 0.55s ease-out forwards;
            will-change: transform, opacity;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(-50px); }
        }

        /* Мини-индикатор сохранения */
        .save-indicator {
            position: fixed;
            bottom: calc(8px + env(safe-area-inset-bottom));
            right: 12px;
            background: rgba(15, 18, 31, 0.9);
            border: 1px solid #7ae0a0;
            color: #7ae0a0;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 300;
            pointer-events: none;
        }

        .save-indicator.show {
            opacity: 1;
        }

        @media (max-height: 700px) {
            .tap-area { max-width: 180px; margin: 4px auto 12px; }
            .tap-emoji { font-size: clamp(3rem, 12vw, 4rem); }
            .balance { padding: 8px 18px; min-height: 50px; }
            .container-btn { padding: 10px 4px; min-height: 80px; }
            .log { height: 68px; }
        }

        @media (max-height: 600px) {
            .tap-area { max-width: 140px; margin: 2px auto 8px; }
            .tap-emoji { font-size: clamp(2.5rem, 10vw, 3.2rem); }
            .info-row { margin-bottom: 8px; }
            .balance { padding: 6px 16px; min-height: 44px; font-size: 1.4rem; }
            .container-btn { padding: 8px 4px; min-height: 72px; gap: 1px; }
            .log { height: 60px; padding: 8px 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .tap-area { max-width: 120px; }
            .tap-emoji { font-size: 3rem; }
        }
    </style>
</head>
<body>
<div class="game" id="game">
    <div class="balance">
        <span>💵</span> <span id="balanceDisplay">0</span> <span style="font-size:0.6em; color:#a0a8c0;">$</span>

    <div class="tap-area" id="tapArea">

    <div class="containers">

            <div class="price">💵 50 000</div>

        <button class="container-btn mythic" id="mythicBtn" data-type="mythic">

</div>

<!-- Модалка выпадения -->
<div class="modal" id="modal">
    <div class="modal-card">
        <div class="rarity-badge common" id="modalRarity">Обычная</div>
        <div class="modal-emoji" id="modalEmoji">🚗</div>

        <div class="modal-car-price" id="modalCarPrice">12 000 $</div>
        <div class="sell-warning">⚠️ Скупщик даёт только 25%</div>
        <div class="modal-actions">
            <button class="modal-btn keep" id="modalKeepBtn">
                🏠 В гараж
                <span class="sub">Оставить</span>
            </button>
            <button class="modal-btn sell" id="modalSellBtn">
                💸 Скупщику
                <span class="sub" id="sellPriceLabel">+3 000 $</span>

</div>

<!-- Модалка гаража -->

        <div class="garage-title">🏠 Мой гараж</div>

        <div class="garage-title">🏅 Достижения</div>
        <div class="ach-progress">Открыто: <b id="achProgressText">0 / 10</b></div>

</div>

<!-- Тост -->
<div class="toast" id="toast">
    <div class="toast-icon" id="toastIcon">🏆</div>

        <div class="toast-title">Достижение!</div>
        <div class="toast-name" id="toastName">Первая машина</div>
        <div class="toast-desc" id="toastDesc">Открой первый контейнер</div>
    </div>
</div>

<!-- Индикатор сохранения -->
<div class="save-indicator" id="saveIndicator">💾 Сохранено</div>

<script>
    (function() {
        'use strict';

        // ================== КОНСТАНТЫ ==================
        const SAVE_KEY = 'carTapGame_v1';
        const SELL_RATE = 0.25;
        const tapValue = 1;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // ================== АВТОМОБИЛИ ==================
        const commonCars = [
            { name: 'Lada Granta', price: 8_000, emoji: '🚗', rarity: 'common', chance: 30 },
            { name: 'Lada Vesta', price: 12_000, emoji: '🚗', rarity: 'common', chance: 25 },
            { name: 'Lada Niva', price: 10_000, emoji: '🚙', rarity: 'common', chance: 20 },
            { name: 'UAZ Patriot', price: 15_000, emoji: '🚙', rarity: 'common', chance: 12 },
            { name: 'GAZ Volga', price: 9_000, emoji: '🚕', rarity: 'common', chance: 8 },
            { name: 'Renault Logan', price: 11_000, emoji: '🚗', rarity: 'common', chance: 3 },
            { name: 'Hyundai Solaris', price: 14_000, emoji: '🚙', rarity: 'common', chance: 1.5 },
            { name: 'BMW 3 Series', price: 45_000, emoji: '🏎️', rarity: 'rare', chance: 0.5, jackpot: true }
        ];

        const rareCars = [
            { name: 'Lada Vesta Sport', price: 25_000, emoji: '🚗', rarity: 'common', chance: 25 },
            { name: 'UAZ Patriot Limited', price: 30_000, emoji: '🚙', rarity: 'common', chance: 22 },
            { name: 'Toyota Corolla', price: 28_000, emoji: '🚘', rarity: 'common', chance: 20 },
            { name: 'Kia Rio', price: 22_000, emoji: '🚗', rarity: 'common', chance: 15 },
            { name: 'Hyundai Elantra', price: 26_000, emoji: '🚘', rarity: 'common', chance: 10 },
            { name: 'Skoda Octavia', price: 32_000, emoji: '🚗', rarity: 'rare', chance: 5 },
            { name: 'Mazda 6', price: 38_000, emoji: '🚘', rarity: 'rare', chance: 2.5 },
            { name: 'Porsche 911', price: 150_000, emoji: '🏎️', rarity: 'epic', chance: 0.5, jackpot: true }
        ];

        const epicCars = [
            { name: 'Toyota Camry', price: 45_000, emoji: '🚘', rarity: 'common', chance: 25 },
            { name: 'Kia K5', price: 42_000, emoji: '🚗', rarity: 'common', chance: 22 },
            { name: 'Hyundai Sonata', price: 44_000, emoji: '🚙', rarity: 'common', chance: 18 },
            { name: 'Volkswagen Passat', price: 52_000, emoji: '🚘', rarity: 'common', chance: 15 },
            { name: 'BMW 5 Series', price: 90_000, emoji: '🏎️', rarity: 'rare', chance: 10 },
            { name: 'Mercedes E-Class', price: 85_000, emoji: '🚘', rarity: 'rare', chance: 6 },
            { name: 'Audi A6', price: 78_000, emoji: '🚘', rarity: 'rare', chance: 3.5 },
            { name: 'Ferrari 488', price: 400_000, emoji: '🏎️', rarity: 'legendary', chance: 0.5, jackpot: true }
        ];

        const legendaryCars = [
            { name: 'BMW X5', price: 120_000, emoji: '🚙', rarity: 'common', chance: 25 },
            { name: 'Mercedes GLE', price: 130_000, emoji: '🚙', rarity: 'common', chance: 22 },
            { name: 'Audi Q7', price: 125_000, emoji: '🚙', rarity: 'common', chance: 18 },
            { name: 'Porsche Cayenne', price: 180_000, emoji: '🚙', rarity: 'rare', chance: 15 },
            { name: 'BMW M5', price: 220_000, emoji: '🏎️', rarity: 'rare', chance: 10 },
            { name: 'Mercedes AMG GT', price: 280_000, emoji: '🏎️', rarity: 'epic', chance: 6 },
            { name: 'Porsche 911 Turbo', price: 320_000, emoji: '🏎️', rarity: 'epic', chance: 3.5 },
            { name: 'Bugatti Chiron', price: 2_500_000, emoji: '🏎️', rarity: 'legendary', chance: 0.5, jackpot: true }
        ];

        const mythicCars = [
            { name: 'Lamborghini Huracan', price: 450_000, emoji: '🏎️', rarity: 'rare', chance: 25 },
            { name: 'Ferrari F8 Tributo', price: 500_000, emoji: '🏎️', rarity: 'rare', chance: 22 },
            { name: 'McLaren 720S', price: 480_000, emoji: '🏎️', rarity: 'rare', chance: 18 },
            { name: 'Aston Martin DB11', price: 420_000, emoji: '🏎️', rarity: 'epic', chance: 15 },
            { name: 'Rolls-Royce Ghost', price: 700_000, emoji: '👑', rarity: 'epic', chance: 10 },
            { name: 'Bugatti Veyron', price: 1_800_000, emoji: '🏎️', rarity: 'legendary', chance: 6 },
            { name: 'Pagani Huayra', price: 2_400_000, emoji: '🏎️', rarity: 'legendary', chance: 3.5 },
            { name: 'Koenigsegg Jesko', price: 4_500_000, emoji: '👑', rarity: 'mythic', chance: 0.5, jackpot: true }
        ];

        // ================== ДОСТИЖЕНИЯ ==================
        const achievements = [
            { id: 'first_car', icon: '🚗', name: 'Первая машина', desc: 'Открой свой первый контейнер' },
            { id: 'first_expensive', icon: '💎', name: 'Первый дорогой', desc: 'Получи машину дороже 100 000 $' },
            { id: 'jackpot_common', icon: '🎰', name: 'Джекпот: BMW', desc: 'Выбей BMW из обычного' },
            { id: 'jackpot_rare', icon: '🎰', name: 'Джекпот: Porsche', desc: 'Выбей Porsche из редкого' },
            { id: 'jackpot_epic', icon: '🎰', name: 'Джекпот: Ferrari', desc: 'Выбей Ferrari из эпического' },
            { id: 'jackpot_legendary', icon: '🎰', name: 'Джекпот: Bugatti', desc: 'Выбей Bugatti из легендарного' },
            { id: 'jackpot_mythic', icon: '👑', name: 'МИФИЧЕСКИЙ ДЖЕКПОТ', desc: 'Выбей Koenigsegg' },
            { id: 'garage_5', icon: '🏠', name: 'Коллекционер', desc: 'Собери 5 машин в гараже' },
            { id: 'garage_20', icon: '🏛️', name: 'Автомузей', desc: 'Собери 20 машин в гараже' },
            { id: 'millionaire', icon: '💰', name: 'Миллионер', desc: 'Накопи 1 000 000 $' }
        ];

        // ================== СОСТОЯНИЕ ==================
        let balance = 0;
        let isProcessing = false;
        let openedCount = 0;
        let garage = [];
        let currentCar = null;
        let carIdCounter = 0;
        let unlockedAchievements = new Set();

        // ================== DOM ==================
        const $ = id => document.getElementById(id);
        const balanceDisplay = $('balanceDisplay');
        const tapArea = $('tapArea');
        const logContainer = $('log');
        const modal = $('modal');
        const modalRarity = $('modalRarity');
        const modalEmoji = $('modalEmoji');
        const modalCarName = $('modalCarName');
        const modalCarPrice = $('modalCarPrice');
        const modalKeepBtn = $('modalKeepBtn');
        const modalSellBtn = $('modalSellBtn');
        const sellPriceLabel = $('sellPriceLabel');
        const garageBtn = $('garageBtn');
        const garageCount = $('garageCount');
        const garageModal = $('garageModal');
        const garageList = $('garageList');
        const garageTotalCount = $('garageTotalCount');
        const garageTotalValue = $('garageTotalValue');
        const garageCloseBtn = $('garageCloseBtn');
        const achBtn = $('achBtn');
        const achCounter = $('achCounter');
        const achModal = $('achModal');
        const achList = $('achList');
        const achProgressText = $('achProgressText');
        const achCloseBtn = $('achCloseBtn');
        const toast = $('toast');
        const toastIcon = $('toastIcon');
        const toastName = $('toastName');
        const toastDesc = $('toastDesc');
        const saveIndicator = $('saveIndicator');

        const containerButtons = {
            common: $('commonBtn'),
            rare: $('rareBtn'),
            epic: $('epicBtn'),
            legendary: $('legendaryBtn'),
            mythic: $('mythicBtn')
        };

        const containerData = {
            common:    { price: 500,        cars: commonCars,    jackpot: 'BMW 3 Series' },
            rare:      { price: 5_000,      cars: rareCars,      jackpot: 'Porsche 911' },
            epic:      { price: 50_000,     cars: epicCars,      jackpot: 'Ferrari 488' },
            legendary: { price: 500_000,    cars: legendaryCars, jackpot: 'Bugatti Chiron' },
            mythic:    { price: 5_000_000,  cars: mythicCars,    jackpot: 'Koenigsegg Jesko' }
        };

        // ================== СОХРАНЕНИЕ ==================
        let saveTimer = null;
        let indicatorTimer = null;

        function showSaveIndicator() {
            saveIndicator.classList.add('show');
            if (indicatorTimer) clearTimeout(indicatorTimer);
            indicatorTimer = setTimeout(() => {
                saveIndicator.classList.remove('show');
            }, 1000);
        }

        // Сохранить состояние в localStorage
        function saveProgress() {
            if (saveTimer) {
                clearTimeout(saveTimer);
                saveTimer = null;
            }

            try {
                const data = {
                    version: 1,
                    balance: balance,
                    openedCount: openedCount,
                    garage: garage,
                    carIdCounter: carIdCounter,
                    achievements: Array.from(unlockedAchievements),
                    timestamp: Date.now()
                };
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
                showSaveIndicator();
            } catch (e) {
                // localStorage может быть недоступен (приватный режим, переполнение)
                console.warn('Не удалось сохранить прогресс:', e);
            }
        }

        // Отложенное сохранение (для частых действий — тапов)
        function scheduleSave(delay = 800) {
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(saveProgress, delay);
        }

        // Загрузить состояние из localStorage
        function loadProgress() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) return false;

                const data = JSON.parse(raw);
                if (!data || data.version !== 1) return false;

                balance = typeof data.balance === 'number' ? data.balance : 0;
                openedCount = typeof data.openedCount === 'number' ? data.openedCount : 0;
                garage = Array.isArray(data.garage) ? data.garage : [];
                carIdCounter = typeof data.carIdCounter === 'number' ? data.carIdCounter : 0;
                unlockedAchievements = new Set(Array.isArray(data.achievements) ? data.achievements : []);

                return true;
            } catch (e) {
                console.warn('Не удалось загрузить прогресс:', e);
                return false;
            }
        }

        // Сброс прогресса
        function resetProgress() {
            try {
                localStorage.removeItem(SAVE_KEY);
            } catch (e) {}
            balance = 0;
            openedCount = 0;
            garage = [];
            carIdCounter = 0;
            unlockedAchievements = new Set();
        }

        // ================== УТИЛИТЫ ==================
        function vibrate(pattern) {
            if (isMobile && navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch(e) {}
            }
        }

        function fmt(n) {
            return n.toLocaleString('ru-RU');
        }

        // ================== UI ==================
        function updateBalance() {
            balanceDisplay.textContent = fmt(balance);
        }

        function updateGarageCount() {
            garageCount.textContent = garage.length;
        }

        function updateAchCounter() {
            achCounter.textContent = `${unlockedAchievements.size}/${achievements.length}`;
        }

        function rarityName(r) {
            return {
                common: 'Обычная', rare: 'Редкая', epic: 'Эпическая',
                legendary: 'Легендарная', mythic: 'МИФИЧЕСКАЯ'
            }[r] || 'Обычная';
        }

        function addLog(car, action) {
            const logItem = document.createElement('div');
            logItem.className = 'log-item ' + car.rarity;

            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.textContent = `${car.emoji} ${car.name}`;

            const priceSpan = document.createElement('span');
            priceSpan.className = 'price';

            if (action === 'garage') {
                priceSpan.textContent = `🏠`;
                priceSpan.style.color = '#7ae0a0';
            } else {
                const sellPrice = Math.floor(car.price * SELL_RATE);
                priceSpan.textContent = `+${fmt(sellPrice)} $`;
                priceSpan.style.color = '#ff6b9d';
            }

            logItem.appendChild(nameSpan);
            logItem.appendChild(priceSpan);
            logContainer.prepend(logItem);

            while (logContainer.children.length > 15) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function addAchLog(ach) {
            const logItem = document.createElement('div');
            logItem.className = 'log-item achievement';
            logItem.innerHTML = `<span class="name">${ach.icon} ${ach.name}</span><span class="price" style="color:#ffd966">🏅</span>`;
            logContainer.prepend(logItem);
            while (logContainer.children.length > 15) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function unlockAchievement(id) {
            if (unlockedAchievements.has(id)) return;
            const ach = achievements.find(a => a.id === id);
            if (!ach) return;

            unlockedAchievements.add(id);
            updateAchCounter();
            addAchLog(ach);
            showToast(ach);
            vibrate([30, 30, 30]);
            scheduleSave(300);

            if (achModal.classList.contains('show')) {
                renderAchievements();
            }
        }

        let toastTimer = null;
        function showToast(ach) {
            toastIcon.textContent = ach.icon;
            toastName.textContent = ach.name;
            toastDesc.textContent = ach.desc;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        function showCarModal(car) {
            currentCar = car;
            modalRarity.textContent = rarityName(car.rarity);
            modalRarity.className = 'rarity-badge ' + car.rarity;
            modalEmoji.textContent = car.emoji;
            modalCarName.textContent = car.name;
            modalCarPrice.textContent = `${fmt(car.price)} $`;

            const sellPrice = Math.floor(car.price * SELL_RATE);
            sellPriceLabel.textContent = `+${fmt(sellPrice)} $`;

            modal.classList.add('show');
        }

        function hideModal() {
            modal.classList.remove('show');
            currentCar = null;
        }

        function getRandomCar(cars) {
            const totalWeight = cars.reduce((sum, c) => sum + c.chance, 0);
            let random = Math.random() * totalWeight;
            for (const car of cars) {
                if (random < car.chance) return car;
                random -= car.chance;
            }
            return cars[cars.length - 1];
        }

        // ================== ЛОГИКА ==================
        function openContainer(type) {
            if (isProcessing) return;

            const data = containerData[type];
            if (!data) return;

            const price = data.price;
            const carsArray = data.cars;

            if (balance < price) {
                const btn = containerButtons[type];
                btn.style.transform = 'translateX(4px)';
                setTimeout(() => btn.style.transform = '', 120);
                vibrate(20);
                return;
            }

            isProcessing = true;
            balance -= price;
            updateBalance();
            openedCount++;

            const car = getRandomCar(carsArray);
            const carCopy = { ...car, id: ++carIdCounter, fromContainer: type };

            checkDropAchievements(carCopy);
            showCarModal(carCopy);
            vibrate(15);
            scheduleSave(200);

            setTimeout(() => { isProcessing = false; }, 200);
        }

        function checkDropAchievements(car) {
            if (openedCount >= 1) unlockAchievement('first_car');
            if (car.price >= 100_000) unlockAchievement('first_expensive');
            if (car.jackpot) {
                const map = {
                    common: 'jackpot_common',
                    rare: 'jackpot_rare',
                    epic: 'jackpot_epic',
                    legendary: 'jackpot_legendary',
                    mythic: 'jackpot_mythic'
                };
                const achId = map[car.fromContainer];
                if (achId) unlockAchievement(achId);
            }
        }

        function checkStateAchievements() {
            if (balance >= 1_000_000) unlockAchievement('millionaire');
            if (garage.length >= 5) unlockAchievement('garage_5');
            if (garage.length >= 20) unlockAchievement('garage_20');
        }

        function keepCar() {
            if (!currentCar) return;
            garage.push(currentCar);
            addLog(currentCar, 'garage');
            updateGarageCount();
            hideModal();
            checkStateAchievements();
            vibrate(10);
            saveProgress();
        }

        function sellCar() {
            if (!currentCar) return;
            const sellPrice = Math.floor(currentCar.price * SELL_RATE);
            balance += sellPrice;
            updateBalance();
            addLog(currentCar, 'sell');
            hideModal();
            checkStateAchievements();
            vibrate(10);
            saveProgress();
        }

        // ================== ГАРАЖ ==================
        function openGarage() {
            renderGarage();
            garageModal.classList.add('show');
        }

        function closeGarage() {
            garageModal.classList.remove('show');
        }

        function renderGarage() {
            garageList.innerHTML = '';

            if (garage.length === 0) {
                garageList.innerHTML = '<div class="garage-empty">🚗 Гараж пуст.<br>Открывай контейнеры и оставляй машины!</div>';
                garageTotalCount.textContent = '0';
                garageTotalValue.textContent = '0 $';
                return;
            }

            const totalValue = garage.reduce((sum, c) => sum + c.price, 0);
            garageTotalCount.textContent = garage.length;
            garageTotalValue.textContent = fmt(totalValue) + ' $';

            const sorted = [...garage].sort((a, b) => b.price - a.price);
            const fragment = document.createDocumentFragment();

            sorted.forEach(car => {
                const item = document.createElement('div');
                item.className = 'garage-item ' + car.rarity;

                const emoji = document.createElement('div');
                emoji.className = 'garage-item-emoji';
                emoji.textContent = car.emoji;

                const info = document.createElement('div');
                info.className = 'garage-item-info';

                const name = document.createElement('div');
                name.className = 'garage-item-name';
                name.textContent = car.name;

                const price = document.createElement('div');
                price.className = 'garage-item-price';
                price.textContent = fmt(car.price) + ' $';

                info.appendChild(name);
                info.appendChild(price);

                const sellPrice = Math.floor(car.price * SELL_RATE);
                const sellBtn = document.createElement('button');
                sellBtn.className = 'garage-item-sell';
                sellBtn.innerHTML = `💸 +${fmt(sellPrice)} $<span class="sellpct">25%</span>`;
                sellBtn.addEventListener('click', () => {
                    balance += sellPrice;
                    updateBalance();
                    garage = garage.filter(c => c.id !== car.id);
                    updateGarageCount();
                    addLog(car, 'sell');
                    renderGarage();
                    checkStateAchievements();
                    vibrate(10);
                    saveProgress();
                });

                item.appendChild(emoji);
                item.appendChild(info);
                item.appendChild(sellBtn);
                fragment.appendChild(item);
            });

            garageList.appendChild(fragment);
        }

        // ================== ДОСТИЖЕНИЯ ==================
        function openAch() {
            renderAchievements();
            achModal.classList.add('show');
        }

        function closeAch() {
            achModal.classList.remove('show');
        }

        function renderAchievements() {
            achProgressText.textContent = `${unlockedAchievements.size} / ${achievements.length}`;
            const fragment = document.createDocumentFragment();

            achievements.forEach(ach => {
                const unlocked = unlockedAchievements.has(ach.id);
                const item = document.createElement('div');
                item.className = 'ach-item' + (unlocked ? ' unlocked' : '');

                const icon = document.createElement('div');
                icon.className = 'ach-item-icon';
                icon.textContent = ach.icon;

                const info = document.createElement('div');
                info.className = 'ach-item-info';

                const name = document.createElement('div');
                name.className = 'ach-item-name';
                name.textContent = ach.name;

                const desc = document.createElement('div');
                desc.className = 'ach-item-desc';
                desc.textContent = ach.desc;

                info.appendChild(name);
                info.appendChild(desc);

                const status = document.createElement('div');
                status.className = 'ach-item-status';
                status.textContent = unlocked ? '✅' : '🔒';

                item.appendChild(icon);
                item.appendChild(info);
                item.appendChild(status);
                fragment.appendChild(item);
            });

            achList.innerHTML = '';
            achList.appendChild(fragment);
        }

        // ================== ТАП ==================
        let tapLocked = false;

        function handleTap(clientX, clientY) {
            if (tapLocked) return;
            tapLocked = true;

            balance += tapValue;
            updateBalance();

            tapArea.classList.add('pressed');
            setTimeout(() => tapArea.classList.remove('pressed'), 80);

            const floating = document.createElement('div');
            floating.className = 'floating-money';
            floating.textContent = `+${tapValue}$`;
            floating.style.left = clientX + 'px';
            floating.style.top = clientY + 'px';
            document.body.appendChild(floating);
            setTimeout(() => floating.remove(), 550);

            vibrate(8);
            checkStateAchievements();
            scheduleSave(1500); // отложенное сохранение, чтобы не писать на каждый тап

            setTimeout(() => { tapLocked = false; }, 30);
        }

        tapArea.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap(e.clientX, e.clientY);
        }, { passive: false });

        if (!window.PointerEvent) {
            tapArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                handleTap(t.clientX, t.clientY);
            }, { passive: false });
            tapArea.addEventListener('mousedown', (e) => {
                handleTap(e.clientX, e.clientY);
            });
        }

        // ================== ОБРАБОТЧИКИ ==================
        Object.keys(containerButtons).forEach(type => {
            containerButtons[type].addEventListener('click', () => openContainer(type));
        });

        modalKeepBtn.addEventListener('click', keepCar);
        modalSellBtn.addEventListener('click', sellCar);

        garageBtn.addEventListener('click', openGarage);
        garageCloseBtn.addEventListener('click', closeGarage);
        garageModal.addEventListener('click', (e) => {
            if (e.target === garageModal) closeGarage();
        });

        achBtn.addEventListener('click', openAch);
        achCloseBtn.addEventListener('click', closeAch);
        achModal.addEventListener('click', (e) => {
            if (e.target === achModal) closeAch();
        });

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

        // Сохраняем при уходе со страницы / сворачивании
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                saveProgress();
            }
        });

        window.addEventListener('pagehide', saveProgress);
        window.addEventListener('beforeunload', saveProgress);

        // Сохраняем каждые 30 секунд на всякий случай
        setInterval(saveProgress, 30000);

        // ================== ИНИЦИАЛИЗАЦИЯ ==================
        const loaded = loadProgress();

        updateBalance();
        updateGarageCount();
        updateAchCounter();

        // Очищаем лог перед инициализацией
        logContainer.innerHTML = '';

        if (loaded) {
            // Приветствие для вернувшегося игрока
            const welcomeItem = document.createElement('div');
            welcomeItem.className = 'log-item achievement';
            welcomeItem.innerHTML = `<span class="name">💾 Прогресс загружен! Баланс: ${fmt(balance)} $</span>`;
            logContainer.appendChild(welcomeItem);

            if (garage.length > 0) {
                const garageItem = document.createElement('div');
                garageItem.className = 'log-item';
                garageItem.innerHTML = `<span class="name">🏠 В гараже машин: ${garage.length}</span>`;
                logContainer.appendChild(garageItem);
            }

            const hintItem = document.createElement('div');
            hintItem.className = 'log-item';
            hintItem.innerHTML = `<span class="name">👆 Продолжай тапать!</span>`;
            logContainer.appendChild(hintItem);
        } else {
            // Первая игра
            const initLog = document.createElement('div');
            initLog.className = 'log-item';
            initLog.innerHTML = '<span class="name">Тапай 👆 (+1$) и открывай контейнеры!</span>';
            logContainer.appendChild(initLog);

            const hintLog = document.createElement('div');
            hintLog.className = 'log-item';
            hintLog.innerHTML = '<span class="name">💾 Прогресс сохраняется автоматически</span>';
            logContainer.appendChild(hintLog);
        }

        // Сохраняем при первом запуске, чтобы инициализировать ключ
        if (!loaded) {
            saveProgress();
        }
    })();
</script>
</body>
</html>
